version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: always

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  backend:
    build:
      context: ./SkillLink
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PYTHON_EMBEDDING_URL=http://python-service:5000/embed
    depends_on:
      - redis
      - python-service
    restart: always
